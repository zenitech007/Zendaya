<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Zendaya Hologram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,body { margin:0; height:100%; background: transparent; overflow:hidden; }
    #overlay {
      position: absolute; top: 8px; right: 8px; z-index: 10; pointer-events:none;
      color: white; font-family: sans-serif; text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }
    canvas { display:block; }
    /* simple reaction badge */
    #reactionBadge {
      position: absolute; left: 50%; top: 8%; transform: translateX(-50%); pointer-events:none;
      z-index: 12; font-size: 24px; color: white; opacity: 0;
      transition: opacity 350ms ease, transform 350ms ease;
    }
  </style>
  <!-- qwebchannel is available to QWebEngine at qrc:///qtwebchannel/qwebchannel.js -->
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.module.js",
        "GLTFLoader": "https://cdn.jsdelivr.net/npm/three@0.153.0/examples/jsm/loaders/GLTFLoader.js"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">Zendaya</div>
  <div id="reactionBadge"></div>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    // Scene, camera, renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 1.4, 2.6);

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0); // transparent
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 1.1);
    const dir = new THREE.DirectionalLight(0xffffff, 0.7);
    dir.position.set(2,4,5);
    scene.add(ambient, dir);

    const loader = new GLTFLoader();
    let avatarModel = null;
    let jawNode = null;
    let mouthValue = 0;
    let emotion = "neutral";

    // Default avatar — replace from Python using bridge.setAvatar(url)
    let defaultAvatar = "https://models.readyplayer.me/68f4900c30d2941a6e0a4e9d.glb";

    function loadAvatar(url) {
      loader.load(url,
        (gltf) => {
          if (avatarModel) scene.remove(avatarModel);
          avatarModel = gltf.scene;
          // position & scale tuned to fit small window
          avatarModel.position.set(0, -1.45, 0);
          avatarModel.scale.set(1.3, 1.3, 1.3);
          scene.add(avatarModel);

          // attempt to find a jaw/mouth node for lip-sync
          avatarModel.traverse((n) => {
            if (!jawNode && /jaw|mouth|lower|lip/i.test(n.name)) {
              jawNode = n;
            }
          });
        },
        (xhr) => {
          // loading progress
        },
        (err) => {
          console.error("Avatar load error", err);
        }
      );
    }

    loadAvatar(defaultAvatar);

    // -- idle animation + small float
    function animate() {
      requestAnimationFrame(animate);
      // idle breathing/float
      if (avatarModel) {
        avatarModel.rotation.y += 0.0018;
        avatarModel.position.y = -1.45 + Math.sin(Date.now() * 0.0008) * 0.03;
      }
      // mouth transform (simple)
      if (jawNode) {
        // if we found jaw node, rotate a little based on mouthValue
        jawNode.rotation.x = -0.08 * mouthValue;
      } else if (avatarModel) {
        // fallback: scale a tiny bit the lower part by finding a bounding box center
        // find a mesh to modify (first skinnedMesh)
        let target = null;
        avatarModel.traverse((n) => {
          if (!target && n.isMesh) target = n;
        });
        if (target) {
          const s = 1 + mouthValue * 0.08;
          target.scale.set(1, s, 1);
        }
      }
      renderer.render(scene, camera);
    }
    animate();

    // --- Reaction badge helper ---
    const badge = document.getElementById('reactionBadge');
    function showBadge(text, ttl=1600) {
      badge.textContent = text;
      badge.style.opacity = "1";
      badge.style.transform = "translateX(-50%) translateY(0)";
      setTimeout(()=> {
        badge.style.opacity = "0";
        badge.style.transform = "translateX(-50%) translateY(-12px)";
      }, ttl);
    }

    // --- JS API used by Python via QWebChannel ---
    window.setMouth = (value) => {
      // expected value 0..1
      mouthValue = Math.min(Math.max(value, 0), 1);
    };

    // Advanced emotion mapping for avatar animation and mood
    let currentEmotion = "neutral";
    window.setEmotion = function (emotion) {
      currentEmotion = emotion;
      // Show badge for feedback
      switch (emotion) {
        case "energetic":
          showBadge("⚡");
          break;
        case "focused":
          showBadge("🎯");
          break;
        case "soothing":
          showBadge("🌙");
          break;
        case "confused":
          showBadge("�");
          break;
        case "amazed":
          showBadge("😮");
          break;
        case "alert":
          showBadge("🔔");
          break;
        case "happy":
          showBadge("😊");
          break;
        case "thinking":
          showBadge("🤔");
          break;
        case "sad":
          showBadge("😔");
          break;
        default:
          showBadge("�");
      }

      // If ReadyPlayerMe avatar is present, set mood and style
      const avatar = document.querySelector("rpm-frame");
      if (avatar) {
        switch (emotion) {
          case "energetic":
            avatar.setAttribute("mood", "happy");
            avatar.style.filter = "brightness(1.15)";
            break;
          case "focused":
            avatar.setAttribute("mood", "serious");
            avatar.style.filter = "contrast(1.1)";
            break;
          case "soothing":
            avatar.setAttribute("mood", "calm");
            avatar.style.filter = "opacity(0.8)";
            break;
          case "confused":
            avatar.setAttribute("mood", "thinking");
            avatar.style.filter = "blur(0.5px)";
            break;
          case "amazed":
            avatar.setAttribute("mood", "surprised");
            avatar.style.filter = "saturate(1.3)";
            break;
          case "alert":
            avatar.setAttribute("mood", "alert");
            avatar.style.filter = "brightness(1.3)";
            break;
          default:
            avatar.setAttribute("mood", "neutral");
            avatar.style.filter = "none";
        }
      }
      // For Three.js model, you can add more advanced tint/morph logic here if needed
      console.log(`Avatar emotion updated → ${emotion}`);
    };

    window.showReaction = (r) => {
      // short set of reactions
      if (r === "blink") {
        showBadge("😉", 600);
      } else if (r === "applause") {
        showBadge("👏", 1400);
      } else if (r === "smile") {
        showBadge("🙂", 1200);
      } else {
        showBadge(r || "✨", 1000);
      }
    };

    window.setAvatar = (url) => {
      if (!url) return;
      loadAvatar(url);
    };

    window.onHostShow = () => {
      // subtle scale up when shown
      if (avatarModel) avatarModel.scale.multiplyScalar(1.02);
    };

    window.onHostHide = () => {
      // nothing for now
    };

    // Expose a tiny "mouth amplitude to emotion" helper for local testing
    window._testMouth = (v) => { window.setMouth(v); };

    // ---------------------------
    // Setup Qt WebChannel integration
    // ---------------------------
    if (typeof QWebChannel !== "undefined") {
      // QWebChannel available because the QWebEngine provides it at qrc:///qtwebchannel/qwebchannel.js
      new QWebChannel(qt.webChannelTransport, function(channel) {
        window.bridge = channel.objects.bridge;
        // Optionally, notify Python that the UI is ready (if you want)
        if (window.bridge && window.bridge.ready) {
          try { window.bridge.ready(); } catch(e) {}
        }
      });
    } else {
      console.warn("QWebChannel not found; running standalone.");
    }

    // Resize handler
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
