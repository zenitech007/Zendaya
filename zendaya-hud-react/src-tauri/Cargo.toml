[package]
name = "zendaya-hud"
version = "0.1.0"
description = "Zendaya HUD (Tauri)"
authors = ["IKA"]
edition = "2021"

[lib]
name = "zendaya_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
