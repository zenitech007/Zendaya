[tool.poetry]
name = "zendaya-ai-backend"
version = "1.0.0"
description = "Zendaya AI Assistant - Futuristic Architecture Backend"
authors = ["Zendaya AI Team <team@zendaya-ai.com>"]
readme = "README.md"
packages = [{include = "zendaya_backend"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
# Web Framework
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-multipart = "^0.0.6"
# AI & LLM
langchain = ">=0.1.20"
langchain-google-genai = ">=0.1.0"
# Knowledge Base & Search
# Voice Processing
google-cloud-speech = "^2.21.0"
TTS = { git = "https://github.com/coqui-ai/TTS.git" }
librosa = ">=0.11.0,<0.12.0"
noisereduce = "^3.0.0"
webrtcvad = "^2.0.10"
sentence-transformers = "^4.0.0"
faiss-cpu = "^1.8.0"
# Utilities
requests = "^2.31.0"
python-dotenv = "^1.0.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
aiofiles = "^23.2.1"
httpx = "^0.26.0"
aiohttp = "^3.9.0"
# Scientific Computing
scipy = "^1.11.4"
numpy = "^1.24.3"
scikit-learn = "^1.3.2"
# Computer Vision & Biometrics
opencv-python = "^4.8.1.78"
face-recognition = "^1.3.0"
dlib = "^19.24.2"
# Database
sqlalchemy = "^2.0.23"
alembic = "^1.13.1"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
aiosqlite = "^0.19.0"
supabase = "^2.0.0"
# Security
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
# WebSockets
websockets = ">=12.0"
scapy = "^2.6.1"
pinecone = ">=3.0.0"
langchain-core = ">=0.1.52"
google-generativeai = "^0.8.5"
pychromecast = "<14"
python-kasa = "<0.10"
email-validator = "^2.3.0"
pyttsx3 = "^2.99"
psutil = "^7.1.0"
colorama = "^0.4.6"
sounddevice = "^0.5.2"
pillow = "<12.0.0"
playsound = "1.2.2"
speechrecognition = "^3.14.3"
pyaudio = "^0.2.14"
pyqt6 = "^6.9.1"
pyqt6-webengine = "^6.9.0"
pyqt6-webengine-qt6 = "^6.9.2"
pydub = "^0.25.1"
elevenlabs = "^2.19.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-mock = "^3.12.0"
pytest-cov = "^4.1.0"
httpx = "^0.25.2"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]