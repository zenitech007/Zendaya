services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: zendaya
      POSTGRES_PASSWORD: zendaya_secret
      POSTGRES_DB: zendaya_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zendaya"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
